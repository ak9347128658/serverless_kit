# Copy to .github/workflows/ci.yml in your service repository.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install py-serverless-kit pytest -r requirements.txt
      - run: python -m pytest -q

  validate:
    # Catch config the target clouds can't run before anyone deploys.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [aws, gcp, azure]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install py-serverless-kit
      - run: pskit validate --provider ${{ matrix.provider }}
      - run: pskit validate --provider ${{ matrix.provider }} --stage prod
      # Generates main.tf.json without touching the cloud; upload it for reviewers.
      - run: pskit package --provider ${{ matrix.provider }} --skip-deps
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-${{ matrix.provider }}
          path: .pskit/${{ matrix.provider }}-dev/main.tf.json
