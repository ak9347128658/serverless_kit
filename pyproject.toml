[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "py-serverless-kit"
dynamic = ["version"]
description = "Write a Python serverless function once and deploy it to AWS, Azure, GCP, 7 more clouds, or an on-premises host with one YAML file, powered by Terraform."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Asif Khan @ Kavion.ai" }]
maintainers = [{ name = "Asif Khan @ Kavion.ai" }]
keywords = ["serverless", "lambda", "terraform", "multi-cloud", "faas", "aws", "azure", "gcp", "step-functions", "on-premises"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
aws = ["boto3>=1.28"]
gcp = ["google-cloud-workflows>=1.10"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.8",
  "types-PyYAML",
  "build>=1.0",
  "twine>=5.0",
]

[project.scripts]
pskit = "py_serverless_kit.cli.main:main"
py-serverless-kit = "py_serverless_kit.cli.main:main"

[project.urls]
Homepage = "https://github.com/ak9347128658/serverless_kit"
Documentation = "https://github.com/ak9347128658/serverless_kit/tree/main/docs"
Issues = "https://github.com/ak9347128658/serverless_kit/issues"
Changelog = "https://github.com/ak9347128658/serverless_kit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/py_serverless_kit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/py_serverless_kit"]

# The studio shows the step-by-step resource guides; ship the one copy under docs/.
[tool.hatch.build.targets.wheel.force-include]
"docs/resource-guides" = "py_serverless_kit/studio/guides"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "docs/", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045", "S101", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"examples/**" = ["S"]
# Generated example code for users (SQL in strings is shown, never executed by pskit).
"src/py_serverless_kit/core/onprem_clients.py" = ["S608"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
files = ["src/py_serverless_kit"]

[tool.coverage.run]
source = ["py_serverless_kit"]
branch = true
