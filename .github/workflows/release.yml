name: Release

# Push a tag like v0.2.0 to publish. See deploy_docs/PUBLISHING_TO_PYPI.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches __version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/py_serverless_kit/_version.py').read()).group(1))")
          echo "tag=$TAG version=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::tag v$TAG does not match __version__ $VERSION"; exit 1; }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi     # add required reviewers to this environment for a manual gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
